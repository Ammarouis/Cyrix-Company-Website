<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#12315e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3070d0"/>
      <stop offset="100%" stop-color="#20f0f0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3070d0" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="650" cy="100" r="200" fill="#3070d0" opacity="0.12"/>
  <circle cx="120" cy="500" r="180" fill="#20f0f0" opacity="0.08"/>
  <!-- Code window -->
  <rect x="200" y="160" width="400" height="280" rx="12" fill="#0d1f3c" stroke="#3070d0" stroke-opacity="0.4"/>
  <rect x="200" y="160" width="400" height="40" rx="12" fill="#16305a"/>
  <rect x="200" y="188" width="400" height="12" fill="#16305a"/>
  <circle cx="225" cy="180" r="6" fill="#ff5f57"/>
  <circle cx="245" cy="180" r="6" fill="#febc2e"/>
  <circle cx="265" cy="180" r="6" fill="#28c840"/>
  <text x="230" y="230" font-family="monospace" font-size="18" fill="#20f0f0">const app = build();</text>
  <text x="230" y="265" font-family="monospace" font-size="18" fill="#3070d0">app.deploy("production");</text>
  <text x="230" y="300" font-family="monospace" font-size="18" fill="#8aa8d8">// clean, fast, secure</text>
  <rect x="230" y="330" width="220" height="8" rx="4" fill="#1e4a8a"/>
  <rect x="230" y="355" width="160" height="8" rx="4" fill="#1e4a8a"/>
  <rect x="230" y="380" width="190" height="8" rx="4" fill="#1e4a8a"/>
  <rect x="450" y="470" width="200" height="6" fill="url(#accent)" opacity="0.6"/>
</svg>
