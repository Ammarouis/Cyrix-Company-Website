<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#12315e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3070d0"/>
      <stop offset="100%" stop-color="#20f0f0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3070d0" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="680" cy="120" r="200" fill="#3070d0" opacity="0.12"/>
  <circle cx="120" cy="500" r="180" fill="#20f0f0" opacity="0.08"/>
  <!-- Neural network -->
  <g stroke="#3070d0" stroke-opacity="0.6" stroke-width="2">
    <line x1="250" y1="200" x2="400" y2="180"/>
    <line x1="250" y1="200" x2="400" y2="300"/>
    <line x1="250" y1="200" x2="400" y2="420"/>
    <line x1="250" y1="310" x2="400" y2="180"/>
    <line x1="250" y1="310" x2="400" y2="300"/>
    <line x1="250" y1="310" x2="400" y2="420"/>
    <line x1="250" y1="420" x2="400" y2="180"/>
    <line x1="250" y1="420" x2="400" y2="300"/>
    <line x1="250" y1="420" x2="400" y2="420"/>
